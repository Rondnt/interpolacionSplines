# Blueprint de Render para el backend (FastAPI).
# En Render: New > Blueprint > seleccionar este repositorio.
services:
  - type: web
    name: drone-splines-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        # Dominio del frontend en Vercel, p. ej. https://drone-splines.vercel.app
        # (varios orígenes separados por comas)
        sync: false
